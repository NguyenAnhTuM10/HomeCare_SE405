# Dependency updates go through dev (staging) like every other change.
# Until the defense (end of 12/2026): monthly, patch/minor only, at most 2 PRs per ecosystem.
# Security fixes still arrive through Dependabot security alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
      prisma: { patterns: ['prisma', '@prisma/*'] }
      react: { patterns: ['react', 'react-dom', '@types/react*', 'react-router'] }
      tooling:
        { patterns: ['eslint*', 'typescript*', 'prettier', 'vite', 'vitest', 'jest', 'ts-jest'] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directories: [/backend, /infra/nginx]
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
