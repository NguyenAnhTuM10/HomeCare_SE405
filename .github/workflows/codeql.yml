name: CodeQL

# Paused: the repository is private and code scanning on private repos needs GitHub Code Security,
# so results cannot be uploaded and every run fails. Runs only on demand for now.
# To re-enable (public repo or Code Security turned on), restore these triggers:
#   pull_request/push on [main, dev] and schedule cron '0 3 * * 1'.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
